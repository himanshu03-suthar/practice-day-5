<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NOVA AI Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Ambient glow blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- Main Chat Container -->
  <div class="chat-wrapper">

    <!-- Header -->
    <div class="chat-header">
      <div class="header-left">
        <div class="ai-avatar">&#9670;</div>
        <div class="header-info">
          <h1 class="brand-name">NOVA <span>AI</span></h1>
          <div class="status-row">
            <span class="status-dot"></span>
            <span class="status-text">Online &bull; FastAPI Connected</span>
          </div>
        </div>
      </div>
      <div class="header-dots">
        <span style="background:#ef4444"></span>
        <span style="background:#f59e0b"></span>
        <span style="background:#22c55e"></span>
      </div>
    </div>

    <!-- Messages Area -->
    <div class="chat-messages" id="chatMessages">
      <!-- Welcome message -->
      <div class="msg-row ai-row">
        <div class="avatar ai-av">&#9670;</div>
        <div class="bubble ai-bubble">
          Namaste! &#128075; Main aapka <strong>NOVA AI</strong> assistant hoon.<br/>
          Aap mujhse kuch bhi pooch sakte hain!
        </div>
      </div>

      <!-- Suggestion chips -->
      <div class="suggestions" id="suggestions">
        <span onclick="fillInput('Python kya hai?')">Python kya hai?</span>
        <span onclick="fillInput('FastAPI explain karo')">FastAPI explain karo</span>
        <span onclick="fillInput('Internship tips do')">Internship tips do</span>
        <span onclick="fillInput('AI future kya hai?')">AI future kya hai?</span>
      </div>
    </div>

    <!-- Input Area -->
    <div class="chat-input-area">
      <div class="input-box">
        <textarea
          id="userInput"
          placeholder="Apna message likhein... (Enter to send)"
          rows="1"
          oninput="autoResize(this)"
          onkeydown="handleKey(event)"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          <span id="loadIcon" class="hidden">&#8987;</span>
        </button>
      </div>
      <p class="footer-text">NOVA AI &bull; localhost:8000 &bull; Press Enter to send</p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
